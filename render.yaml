# Render blueprint - deploys Tarjem as a free web service.
# Everything heavy (speech recognition, translation, TTS) is a remote API call,
# so the free instance only relays audio and serves static files.
services:
  - type: web
    name: tarjem
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 16 --timeout 120 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Free key from https://console.groq.com/keys - used for Whisper STT and translation.
      - key: GROQ_API_KEY
        sync: false
      # Anyone with the URL can spend your Groq quota without this.
      - key: ACCESS_CODE
        sync: false
      - key: STT_MODEL
        value: whisper-large-v3
      - key: STT_INTERIM_MODEL
        value: whisper-large-v3-turbo
      - key: TRANSLATE_MODELS
        value: openai/gpt-oss-120b,qwen/qwen3.8-27b,qwen/qwen3.6-27b,openai/gpt-oss-20b
      # Optional: set TRANSLATE_PROVIDER=gemini + GEMINI_API_KEY (free at aistudio.google.com)
      - key: TRANSLATE_PROVIDER
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      # Durable conversation storage (Supabase Storage bucket, files only - no SQL).
      # Without these, conversations live in the browser + this instance's disk,
      # and the disk copy is wiped on every redeploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: tarjem
      - key: TTS_VOICE_EN
        value: en-US-JennyNeural
      - key: TTS_VOICE_AR
        value: ar-SA-ZariyahNeural
